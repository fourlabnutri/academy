<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/academy.css"><script src="./config.js"></script><title>Artigos · FourLab Academy</title></head>
<body><div class="shell"><div></div><main><div class="topbar"><span class="crumb" id="crumb">Biblioteca científica</span><span class="avatar" id="meAv"></span></div>
<section class="view">
  <header class="lib-head" id="head"></header>
  <div class="lib-tools"><input class="search" id="q" placeholder="Buscar um estudo, autor ou assunto"><div class="seg" id="filtro"><button class="on" data-f="todos">Todos</button><button data-f="salvos">Salvos</button></div></div>
  <div id="out"></div>
</section></main></div>
<script type="module">
import { supabase, $, esc, guard, shell, qs } from "./assets/app.js";
const p = await guard(); if (!p) throw 0;
shell(p, "artigos");
const slugify = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const [{ data }, { data: salvos }] = await Promise.all([
  supabase.from("academy_artigos").select("id,slug,titulo_pt,titulo_original,autores,periodico,ano,tipo_estudo,tema,publicado_em").eq("etapa", "publicado").order("slug"),
  supabase.from("academy_artigos_salvos").select("artigo_id").eq("user_id", p.id),
]);
const arts = data || [], sv = new Set((salvos || []).map((s) => s.artigo_id));
const temas = [...new Set(arts.map((a) => a.tema).filter(Boolean))].sort();
const temaAtual = temas.find((t) => slugify(t) === qs("tema"));
let filtro = "todos";

const foto = (s) => `assets/fotos/a${[...(s || "")].reduce((h, c) => h + c.charCodeAt(0), 0) % 10 + 1}.jpg`;
const capa = (a) => `<div class="cover"><img src="${foto(a.slug)}" alt="" loading="lazy"><span class="cover-tema">${esc(a.tema || "")}</span></div>`;
const card = (a) => `<a class="acard" href="artigo?id=${a.id}">${capa(a)}
  <div class="acard-body"><span class="chip">${esc(a.tipo_estudo || "Estudo")}</span>
  <h3>${esc(a.titulo_pt || a.titulo_original)}</h3>
  <p class="acard-src">${esc([a.periodico, a.ano].filter(Boolean).join(" · "))}</p></div>
  ${sv.has(a.id) ? '<span class="acard-saved" title="Salvo">★</span>' : ""}</a>`;

if (temaAtual) {
  $("#crumb").innerHTML = `<a href="artigos">Biblioteca científica</a> / ${esc(temaAtual)}`;
  $("#head").innerHTML = `<div class="tema-hero" style="--img:url('assets/temas/${slugify(temaAtual)}.jpg')"><span class="tema-pill">${esc(temaAtual)}</span></div>`;
} else {
  $("#head").innerHTML = `<h1>Biblioteca científica</h1><p class="sub">Estudos selecionados pela equipe FourLab, traduzidos e resumidos para a prática clínica.</p>`;
}
$("#q").oninput = render;
$("#filtro").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filtro = b.dataset.f; [...$("#filtro").children].forEach((x) => x.classList.toggle("on", x === b)); render(); };

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const list = arts.filter((a) => (!temaAtual || a.tema === temaAtual) && (filtro !== "salvos" || sv.has(a.id)) && (!q || JSON.stringify(a).toLowerCase().includes(q)));
  if (!temaAtual && !q && filtro === "todos") {
    $("#out").innerHTML = `<div class="tema-grid">${temas.map((t) => {
      const n = arts.filter((a) => a.tema === t).length;
      return `<a class="tema-tile" href="artigos?tema=${slugify(t)}" style="--img:url('assets/temas/${slugify(t)}.jpg')"><span class="tema-pill">${esc(t)}</span><span class="tema-n">${n} ${n === 1 ? "estudo" : "estudos"}</span></a>`;
    }).join("")}</div>`;
    return;
  }
  $("#out").innerHTML = list.length ? `<div class="acard-grid">${list.map(card).join("")}</div>` : '<div class="card empty">Nenhum estudo encontrado.</div>';
}
render();
</script></body></html>
