<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/academy.css?v=1107b"><script src="./config.js"></script><title>Nova senha · FourLab Academy</title></head>
<body><div class="center-page"><form class="card" id="f" style="max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px">
  <h2 style="font-size:20px">Criar nova senha</h2>
  <div class="field"><label for="senha">Nova senha (mín. 8)</label><input id="senha" type="password" minlength="8" required autocomplete="new-password"></div>
  <div class="msg" id="msg"></div>
  <button class="btn btn-primary" type="submit">Salvar senha</button>
</form></div>
<script type="module">
import { supabase, $, showMsg } from "./assets/app.js";
$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const { error } = await supabase.auth.updateUser({ password: $("#senha").value });
  if (error) return showMsg($("#msg"), "O link expirou. Peça outro em Esqueci a senha.");
  showMsg($("#msg"), "Senha salva. Redirecionando…", "ok"); setTimeout(() => location.href = "login", 1200);
});
</script></body></html>
