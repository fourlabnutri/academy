<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FourLab Academy · Estande</title>
<script src="./config.js"></script><script src="./tv/playlist.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#141013;color:#f5f0ed;font-family:"Maven Pro",Montserrat,system-ui,sans-serif;overflow:hidden;cursor:none}
#palco{position:fixed;inset:0 0 11vh 0;display:grid;place-items:center;background:#000}
#palco video,#palco img{width:100%;height:100%;object-fit:contain}
#vazio{color:#9d8f88;font-size:2.4vh;text-align:center;padding:4vh}
.barra{position:fixed;left:0;right:0;bottom:0;height:11vh;display:flex;align-items:center;gap:4vw;padding:0 3.5vw;
  background:linear-gradient(90deg,#1e181b,#271f23);border-top:.4vh solid;border-image:linear-gradient(90deg,#fdcc03,#e96709,#e3055f,#731b58) 1}
.logo{height:5.5vh;filter:brightness(0) invert(1)}
.cont{display:flex;align-items:center;gap:2.2vw;margin-left:auto}
.selo{display:flex;align-items:center;gap:1.6vw;padding:.8vh 2vw;border-radius:999px;background:linear-gradient(90deg,#fdcc03,#e96709);color:#141013;box-shadow:0 0 4vh rgba(253,204,3,.25)}
.selo .n{font-size:5.2vh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.selo .t{white-space:nowrap;font-size:2vh;font-weight:800;letter-spacing:.35vh;text-transform:uppercase;line-height:1.25}
.selo.pulo{animation:pulo 1.2s ease}
@keyframes pulo{0%{transform:scale(1)}30%{transform:scale(1.12);box-shadow:0 0 10vh rgba(253,204,3,.7)}100%{transform:scale(1)}}
.cta{display:flex;align-items:center;gap:1.4vw}
.cta p{font-size:1.8vh;font-weight:700;line-height:1.3;max-width:20vw}.cta b{color:#fdcc03}
.qr{height:17vh;border-radius:1.6vh;background:#fff;padding:1vh;border:.5vh solid #fdcc03;box-shadow:0 0 3vh rgba(0,0,0,.5);position:relative;margin-top:-7vh;align-self:flex-end;margin-bottom:1vh}
</style></head>
<body>
<div id="palco"><p id="vazio">Coloque os vídeos na pasta tv/midia e liste em tv/playlist.js</p></div>
<div class="barra">
  <img class="logo" src="assets/logo-academy.png" alt="FourLab Academy">
  <div class="cont">
    <div class="selo" id="selo"><span class="n" id="n">–</span><span class="t">★ Membros fundadores</span></div>
    <div class="cta"><p>Escaneie e garanta seu <b>selo de fundador</b></p><img class="qr" src="assets/qr-evento.png" alt="QR Code do cadastro"></div>
  </div>
</div>
<script>
// clique em qualquer lugar = tela cheia
document.body.onclick = () => document.documentElement.requestFullscreen?.();
const lista = window.PLAYLIST || [], palco = document.getElementById("palco");
let i = -1, timer;
function proximo() {
  clearTimeout(timer);
  if (!lista.length) return;
  i = (i + 1) % lista.length;
  const it = lista[i];
  if (/\.(mp4|mov|webm|m4v)$/i.test(it.arquivo)) {
    const v = document.createElement("video");
    v.src = it.arquivo; v.muted = !it.som; v.autoplay = true; v.playsInline = true;
    v.onended = proximo; v.onerror = () => { timer = setTimeout(proximo, 300); };
    palco.replaceChildren(v);
    v.play().catch(() => { v.muted = true; v.play(); });
  } else {
    const im = new Image(); im.src = it.arquivo; im.onerror = () => { timer = setTimeout(proximo, 300); };
    palco.replaceChildren(im);
    timer = setTimeout(proximo, (it.seg || 10) * 1000);
  }
}
proximo();

// contador: total de fundadores, a cada 10 s; anima quando sobe
const cfg = window.ACADEMY_CONFIG, nEl = document.getElementById("n"), selo = document.getElementById("selo");
let atual = null;
function animar(de, ate) {
  const t0 = performance.now();
  const passo = (t) => { const k = Math.min(1, (t - t0) / 900); nEl.textContent = Math.round(de + (ate - de) * k); if (k < 1) requestAnimationFrame(passo); };
  requestAnimationFrame(passo);
  selo.classList.remove("pulo"); void selo.offsetWidth; selo.classList.add("pulo");
}
async function contar() {
  try {
    const r = await fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/academy_fundadores_total", { method: "POST", headers: { apikey: cfg.SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: "{}" });
    if (!r.ok) return;
    const n = await r.json();
    if (atual === null) nEl.textContent = n; else if (n > atual) animar(atual, n);
    atual = n;
  } catch (e) { /* sem internet: mantém o último número */ }
}
contar(); setInterval(contar, 10000);
</script></body></html>
