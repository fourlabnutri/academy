<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/academy.css"><script src="./config.js"></script><title>Início · FourLab Academy</title></head>
<body><div class="shell"><div></div><main><section class="view home">
  <header class="home-top"><div><p class="kicker">FourLab Academy</p><h1 id="ola">Olá</h1><div id="selo"></div></div><span class="avatar" id="meAv"></span></header>
  <div id="hero"></div>
  <div class="stats3" id="stats"></div>
  <section class="sec" id="secTrilhas"><div class="sec-head"><h2>Trilhas</h2></div><div class="tgrid" id="trilhas"></div></section>
  <section class="sec"><div class="sec-head"><h2>Biblioteca científica</h2><a href="artigos">Ver tudo</a></div><div class="chipgrid" id="temas"></div></section>
  <a class="cta-forum" href="forum"><div><h3>Discuta com outros prescritores</h3><p>Debates das aulas, casos clínicos e contato direto com a equipe.</p></div><span>Abrir fórum →</span></a>
</section></main></div>
<script type="module">
import { supabase, $, esc, guard, shell, fmtDur, capaAula } from "./assets/app.js";
const p = await guard(); if (!p) throw 0;
shell(p, "inicio");
$("#ola").textContent = "Olá, " + p.nome.split(" ")[0];
if (p.fundador_num) $("#selo").innerHTML = `<span class="selo-fundador">★ Membro fundador nº ${p.fundador_num}</span>`;
const slugify = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const [{ data: trilhas }, { data: aulas }, { data: prog }, { data: arts }, { data: rank }, { data: live }, { count: lidos }] = await Promise.all([
  supabase.from("academy_trilhas").select("*").eq("etapa", "publicado").order("ordem"),
  supabase.from("academy_aulas").select("id,trilha_id,titulo,professor,duracao_seg,ordem,panda_video_id").eq("etapa", "publicado").order("ordem"),
  supabase.from("academy_progresso").select("aula_id,concluida").eq("user_id", p.id),
  supabase.from("academy_artigos").select("tema").eq("etapa", "publicado"),
  supabase.rpc("academy_ranking"),
  supabase.from("academy_live").select("*").maybeSingle(),
  supabase.from("academy_artigos_lidos").select("artigo_id", { count: "exact", head: true }).eq("user_id", p.id),
]);
const done = new Set((prog || []).filter((x) => x.concluida).map((x) => x.aula_id));
const pos = (rank || []).findIndex((x) => x.user_id === p.id);
$("#stats").innerHTML = [
  (aulas || []).length ? [`${done.size}/${aulas.length}`, "aulas concluídas", "trilhas"] : [lidos || 0, "artigos lidos", "artigos"],
  [pos >= 0 ? rank[pos].pontos : "—", "pontos", "ranking"],
  [pos >= 0 ? `${pos + 1}º` : "—", "no ranking", "ranking"],
].map(([v, l, h]) => `<a class="st" href="${h === "trilhas" ? "#secTrilhas" : h}"><b>${v}</b><span>${l}</span></a>`).join("");
const prox = (aulas || []).find((a) => !done.has(a.id));
const emAnuncio = live && !(live.aulas_liberam_em && new Date(live.aulas_liberam_em) <= new Date());
const agenda = (l) => { const f = (d) => d.toISOString().replace(/[-:]|\.\d{3}/g, ""), i = new Date(l.inicio); return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(l.titulo + " · FourLab Academy") + `&dates=${f(i)}/${f(new Date(+i + 2 * 3600000))}&details=` + encodeURIComponent("https://academy.fourlabnutrition.com.br/live"); };
const quando = (l) => new Date(l.inicio).toLocaleString("pt-BR", { weekday: "long", day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" });
const contagem = (l) => { const m = Math.ceil((new Date(l.inicio) - Date.now()) / 60000); if (m <= 0) return "Acontecendo agora"; const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return "Começa em " + (d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}min` : `${m} min`); };
$("#hero").innerHTML = emAnuncio ? `<div class="hero-aula hero-live" style="--img:url('assets/live/capa.jpg')"><div class="hero-in"><span class="lv-pill">Ao vivo e exclusivo</span><h2>${esc(live.titulo)}</h2><p>${esc(live.professor || "")}${live.inicio ? " · " + esc(quando(live)) : " · Data em breve"}</p>${live.inicio ? `<span class="lv-count">${contagem(live)}</span>` : ""}<div class="hero-acts"><a class="btn btn-primary" href="live">Ir para a sala da live</a>${live.inicio ? `<a class="btn btn-ghost" href="${agenda(live)}" target="_blank" rel="noopener">Salvar na agenda</a>` : ""}</div></div></div>` : prox ? `<a class="hero-aula" href="aula?id=${prox.id}" style="--img:url('${capaAula(prox.panda_video_id)}')"><div class="hero-in"><span class="kicker">${done.size ? "Continue de onde parou" : "Comece por aqui"}</span><h2>${esc(prox.titulo)}</h2><p>${esc(prox.professor || "")}${prox.duracao_seg ? " · " + fmtDur(prox.duracao_seg) : ""}</p><span class="btn btn-primary">▶ Assistir aula</span></div></a>` : "";
$("#trilhas").innerHTML = (trilhas || []).map((t) => {
  const as = (aulas || []).filter((a) => a.trilha_id === t.id), n = as.length, d = as.filter((a) => done.has(a.id)).length, pct = n ? Math.round(d / n * 100) : 0;
  return `<a class="tcard" href="trilha?id=${t.id}"><div class="tcover" style="--img:url('assets/trilhas/${esc(t.slug)}.jpg')"><span class="tcount">${n} aula${n === 1 ? "" : "s"}</span></div><div class="tbody"><h3>${esc(t.titulo)}</h3><p>${esc(t.descricao || "")}</p><div class="bar"><i style="width:${pct}%"></i></div><small>${pct ? pct + "% concluído" : "Não iniciada"}</small></div></a>`;
}).join("") || '<div class="tr-locked">As trilhas com especialistas são liberadas depois da aula inaugural.</div>';
const temas = {}; (arts || []).forEach((a) => { if (a.tema) temas[a.tema] = (temas[a.tema] || 0) + 1; });
$("#temas").innerHTML = Object.entries(temas).sort().map(([t, n]) => `<a class="tchip" href="artigos?tema=${slugify(t)}" style="--img:url('assets/temas/${slugify(t)}.jpg')"><b>${esc(t)}</b><span>${n} estudo${n === 1 ? "" : "s"}</span></a>`).join("") || '<p class="muted">Em breve.</p>';
</script></body></html>
