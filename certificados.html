<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/academy.css?v=1112a"><script src="./config.js"></script><title>Certificados · FourLab Academy</title></head>
<body><div class="shell"><div></div><main><div class="topbar"><span class="crumb">FourLab Academy</span><span class="avatar" id="meAv"></span></div>
<section class="view">
  <div class="page-head"><div><h1>Certificados</h1><div class="sub">Emitido automaticamente ao concluir todas as aulas de uma trilha.</div></div></div>
  <div class="card tbl"><table><thead><tr><th>Trilha</th><th>Carga</th><th>Código</th><th>Emitido</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="modelos"></div>
</section></main></div>
<script type="module">
import { supabase, $, esc, guard, shell, fmtDate, isStaff } from "./assets/app.js";
const p = await guard(); if (!p) throw 0;
shell(p, "certificados");
const { data } = await supabase.from("academy_certificados").select("codigo,emitido_em,academy_trilhas(titulo,carga_horas)").eq("user_id", p.id).order("emitido_em", { ascending: false });
$("#rows").innerHTML = (data || []).map((c) => `<tr><td><b>${esc(c.academy_trilhas.titulo)}</b></td><td class="num">${c.academy_trilhas.carga_horas ? c.academy_trilhas.carga_horas + "h" : "—"}</td><td class="num">${esc(c.codigo)}</td><td>${fmtDate(c.emitido_em)}</td><td style="text-align:right"><a class="btn btn-primary btn-sm" href="certificado?c=${encodeURIComponent(c.codigo)}">Ver e baixar PDF</a></td></tr>`).join("") || '<tr><td colspan="5" class="empty">Conclua todas as aulas de uma trilha para receber o certificado.</td></tr>';
if (isStaff(p)) {
  const { data: ts } = await supabase.from("academy_trilhas").select("id,titulo,carga_horas").order("ordem");
  $("#modelos").innerHTML = `<div class="card tbl" style="margin-top:20px"><div class="adm-tbh"><h2 class="adm-h">Modelos por trilha (só a equipe vê)</h2></div><table><tbody>${(ts || []).map((t) => `<tr><td><b>${esc(t.titulo)}</b></td><td class="num">${t.carga_horas ? t.carga_horas + "h" : "sem carga"}</td><td style="text-align:right"><a class="btn btn-ghost btn-sm" href="certificado?modelo=${t.id}">Ver modelo</a></td></tr>`).join("")}</tbody></table></div>`;
}
</script></body></html>
