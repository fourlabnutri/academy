<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="./favicon.ico"><link rel="stylesheet" href="./assets/academy.css"><script src="./config.js"></script><title>Artigo · FourLab Academy</title></head>
<body><div class="shell"><div></div><main><div class="topbar"><span class="crumb" id="crumb"><a href="artigos">Biblioteca científica</a></span><span class="avatar" id="meAv"></span></div>
<section class="view read">
  <div class="cover cover-lg" id="cover"></div>
  <header class="read-head">
    <div class="chips" id="chips"></div>
    <h1 id="t"></h1>
    <p class="read-src" id="src"></p>
    <div class="read-acts" id="acts"></div>
  </header>
  <nav class="tabs" id="tabs"><button class="on" data-t="resumo">Resumo</button><button data-t="pratica">Na prática</button><button data-t="texto">Texto completo</button></nav>
  <div id="resumo" class="tab"></div>
  <div id="pratica" class="tab" hidden></div>
  <div id="texto" class="tab" hidden>
    <div class="seg" id="lang"><button class="on" data-l="pt">Português</button><button data-l="en">Original</button></div>
    <article class="prose" id="prose"></article>
  </div>
</section></main></div>
<script type="module">
import { supabase, $, $$, esc, guard, shell, qs } from "./assets/app.js";
import { marked } from "https://esm.sh/marked@12.0.2";
const md = (t) => marked.parse(esc(t || ""));
const slugify = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const p = await guard(); if (!p) throw 0;
shell(p, "artigos");
const { data: a } = await supabase.from("academy_artigos").select("*").eq("id", qs("id")).maybeSingle();
if (!a) { $("#t").textContent = "Artigo não encontrado"; throw 0; }
const x = a.extras || {}, np = x.na_pratica || {};
document.title = (a.titulo_pt || a.titulo_original) + " · FourLab Academy";
if (a.tema) $("#crumb").innerHTML += ` / <a href="artigos?tema=${slugify(a.tema)}">${esc(a.tema)}</a>`;
$("#cover").innerHTML = `<img src="assets/capas/${esc(a.slug)}.png" alt="" onerror="this.parentNode.classList.add('cover-empty');this.remove()">`;
$("#chips").innerHTML = [a.tipo_estudo, a.nivel_evidencia && "Evidência " + a.nivel_evidencia.toLowerCase(), a.ano].filter(Boolean).map((c, i) => `<span class="chip${i ? " chip-ghost" : ""}">${esc(c)}</span>`).join("");
$("#t").textContent = a.titulo_pt || a.titulo_original;
$("#src").textContent = [a.autores, a.periodico].filter(Boolean).join(" · ");

/* ações */
const { data: s } = await supabase.from("academy_artigos_salvos").select("artigo_id").match({ user_id: p.id, artigo_id: a.id }).maybeSingle();
let salvo = !!s;
const acts = $("#acts");
acts.innerHTML = `<button class="btn btn-primary btn-sm" id="salvar"></button>`
  + (a.link_original ? `<a class="btn btn-ghost btn-sm" href="${esc(a.link_original)}" target="_blank" rel="noopener">Estudo original ↗</a>` : "")
  + (a.pdf_path ? '<button class="btn btn-ghost btn-sm" id="pdf">PDF</button>' : "");
const paint = () => { $("#salvar").textContent = salvo ? "Salvo ★" : "Salvar"; };
paint();
$("#salvar").onclick = async () => {
  if (salvo) await supabase.from("academy_artigos_salvos").delete().match({ user_id: p.id, artigo_id: a.id });
  else await supabase.from("academy_artigos_salvos").insert({ user_id: p.id, artigo_id: a.id });
  salvo = !salvo; paint();
};
if (a.pdf_path) $("#pdf").onclick = async () => { const { data } = await supabase.storage.from("academy-artigos").createSignedUrl(a.pdf_path, 600); if (data) window.open(data.signedUrl, "_blank"); };

/* aba Resumo */
$("#resumo").innerHTML = `
  ${(x.numeros || []).length ? `<div class="stats">${x.numeros.map((n) => `<div class="stat"><b>${esc(n.valor)}</b><span>${esc(n.rotulo)}</span></div>`).join("")}</div>` : ""}
  ${a.resumo_pt ? `<section class="block"><h2>Em 1 minuto</h2><p class="lead">${esc(a.resumo_pt)}</p></section>` : ""}
  ${(x.pontos_chave || []).length ? `<section class="block"><h2>Pontos-chave</h2><ol class="keys">${x.pontos_chave.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></section>` : ""}
  ${(x.tags || []).length ? `<div class="tags">${x.tags.map((t) => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}`;

/* aba Na prática */
const lab = { dose: "Dose", timing: "Quando tomar", populacao: "Para quem", quando_indicar: "Quando indicar", cuidados: "Cuidados" };
const ks = Object.keys(lab).filter((k) => np[k]);
$("#pratica").innerHTML = ks.length
  ? `<div class="pgrid">${ks.map((k) => `<div class="pcard${k === "cuidados" ? " warn" : ""}"><h3>${lab[k]}</h3><p>${esc(np[k])}</p></div>`).join("")}</div>`
  : '<div class="card empty">Sem orientações práticas para este estudo.</div>';

/* aba Texto */
let lang = "pt";
const paintText = () => { $("#prose").innerHTML = lang === "en" ? (a.texto_original ? md(a.texto_original) : "<p class='muted'>Texto original disponível no estudo original.</p>") : md(a.texto_pt || "Tradução em preparação."); };
if (!a.texto_original) $("#lang").hidden = true;
paintText();
$("#lang").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; lang = b.dataset.l; $$("#lang button").forEach((y) => y.classList.toggle("on", y === b)); paintText(); };

$("#tabs").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  $$("#tabs button").forEach((y) => y.classList.toggle("on", y === b));
  $$(".tab").forEach((t) => (t.hidden = t.id !== b.dataset.t));
};
</script></body></html>
